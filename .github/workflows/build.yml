name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -DskipTests=false package

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eventpulse-jar
          path: target/eventpulse-*.jar
