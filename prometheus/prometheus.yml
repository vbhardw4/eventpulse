global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eventpulse-app
    static_configs:
      # The app runs on the host; prometheus runs in Docker.
      - targets: ["host.docker.internal:8080"]
    metrics_path: /actuator/prometheus
